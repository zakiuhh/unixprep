  header .badge {

    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(56,189,248,0.08);
    border: 1px solid rgba(56,189,248,0.2);
    padding: 5px 14px;
    border-radius: 100px;
    margin-bottom: 16px;
  }

  header h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(28px, 5vw, 52px);
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #e2e8f0 0%, var(--accent) 50%, var(--accent2) 100%);

    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
    margin-bottom: 10px;
  }

  header p {
    color: var(--muted);
    font-size: 14px;
    font-family: 'DM Mono', monospace;
  }

  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 32px;
    padding: 20px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);

  }

    align-items: center;
    gap: 4px;
  }

  .stat-val {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
  }

    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

    height: 3px;
    background: var(--border);
    position: relative;
  }

    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    width: 0%;
    transition: width 0.4s ease;
    box-shadow: 0 0 8px rgba(56,189,248,0.5);
  }

    max-width: 820px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  .question-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s;
  }

  .question-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    opacity: 0;
    transition: opacity 0.3s;
  }

    display: flex;
    align-items: flex-start;
    gap: 14px;
    margin-bottom: 20px;
  }

  .q-num {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--accent);
    background: rgba(56,189,248,0.08);
    border: 1px solid rgba(56,189,248,0.2);
    border-radius: 8px;
    padding: 4px 10px;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .q-text {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.6;
    color: var(--text);
  }

  .options {
    display: grid;
    gap: 10px;
  }

  .option-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
    width: 100%;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: var(--text);
    line-height: 1.4;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(56,189,248,0.06);
    transform: translateX(4px);
  }

  .option-btn .letter {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;

    color: var(--muted);

    background: rgba(34,197,94,0.08);

    background: var(--correct);
    border-color: var(--correct);
    color: #fff;
  }

  .option-btn.wrong {
    border-color: var(--wrong);
    background: rgba(239,68,68,0.08);

    color: #fff;

    background: rgba(34,197,94,0.2);

    color: var(--correct);

    margin-top: 14px;

    border: 1px solid rgba(239,68,68,0.3);
    color: var(--wrong);

    0% { transform: scale(1); }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); }

  @keyframes wrongShake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }

const letters = ['A', 'B', 'C', 'D'];
let answered = 0, correct = 0, wrong = 0;

function updateStats() {
  document.getElementById('answeredQ').textContent = answered;
  document.getElementById('correctQ').textContent = correct;
  document.getElementById('wrongQ').textContent = wrong;
  const pct = answered === 0 ? 0 : Math.round((correct / answered) * 100);
  document.getElementById('pctQ').textContent = pct + '%';
  document.getElementById('progressBar').style.width = ((answered / questions.length) * 100) + '%';

  if (answered === questions.length) {
    const banner = document.getElementById('finalBanner');
    banner.style.display = 'block';
    document.getElementById('finalScore').textContent = correct + '/' + questions.length;
    const pctFinal = Math.round((correct / questions.length) * 100);
    let msg = pctFinal >= 80 ? '🌟 Excellent! You are well-prepared!' :
              pctFinal >= 60 ? '👍 Good effort! Review the missed questions.' :
              '📚 Keep practicing — you can do it!';
    document.getElementById('finalMsg').textContent = msg;
    banner.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function buildQuiz() {
  const area = document.getElementById('quizArea');
  area.innerHTML = '';
  questions.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'card-' + qi;

    const qHeader = document.createElement('div');
    qHeader.className = 'q-header';

    const qNum = document.createElement('div');
    qNum.className = 'q-num';
    qNum.textContent = 'Q' + q.num;

    const qText = document.createElement('div');
    qText.className = 'q-text';
    qText.textContent = q.q;

    qHeader.appendChild(qNum);
    qHeader.appendChild(qText);
    card.appendChild(qHeader);

    const optionsDiv = document.createElement('div');
    optionsDiv.className = 'options';

    q.options.forEach((opt, oi) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.id = 'btn-' + qi + '-' + oi;

      const letter = document.createElement('span');
      letter.className = 'letter';
      letter.textContent = letters[oi];

      const text = document.createElement('span');
      text.textContent = opt;

      btn.appendChild(letter);
      btn.appendChild(text);

      btn.addEventListener('click', () => handleAnswer(qi, oi));
      optionsDiv.appendChild(btn);
    });

    card.appendChild(optionsDiv);
    area.appendChild(card);
  });
}

function handleAnswer(qi, selected) {
  const q = questions[qi];
  const card = document.getElementById('card-' + qi);

  // Disable all buttons
  q.options.forEach((_, oi) => {
    const btn = document.getElementById('btn-' + qi + '-' + oi);
    btn.disabled = true;
  });

  const selectedBtn = document.getElementById('btn-' + qi + '-' + selected);
  const correctBtn = document.getElementById('btn-' + qi + '-' + q.answer);

  const isCorrect = selected === q.answer;

  if (isCorrect) {
    selectedBtn.classList.add('correct');
  } else {
    selectedBtn.classList.add('wrong');
    correctBtn.classList.add('show-correct');
  }

  card.classList.add('answered');

  // Result tag
  const tag = document.createElement('div');
  tag.className = 'result-tag ' + (isCorrect ? 'correct-tag' : 'wrong-tag');
  tag.innerHTML = isCorrect
    ? '✓ Correct! Well done.'
    : '✗ Wrong. Correct answer: ' + letters[q.answer] + '. ' + q.options[q.answer];
  card.appendChild(tag);

  answered++;
  if (isCorrect) correct++; else wrong++;
  updateStats();
}

function resetQuiz() {
  answered = 0; correct = 0; wrong = 0;
  document.getElementById('finalBanner').style.display = 'none';
  updateStats();
  buildQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

buildQuiz();
updateStats();
