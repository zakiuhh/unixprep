<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Physics MCQ Quiz — NED Past Papers</title>
<style>
  :root{
    --bg:#0f1720;
    --panel:#16212c;
    --panel2:#1c2b38;
    --ink:#eef3f7;
    --muted:#93a4b3;
    --accent:#3ea6ff;
    --good:#2ecc71;
    --good-bg:#123322;
    --bad:#ff5c5c;
    --bad-bg:#3a1414;
    --border:#28394a;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:linear-gradient(180deg,#0b1218,#0f1720 40%);
    color:var(--ink);
    min-height:100vh;
    padding:24px 14px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  header{
    text-align:center;
    margin-bottom:22px;
  }
  header h1{
    font-size:1.5rem;
    margin:0 0 6px;
    letter-spacing:.3px;
  }
  header p{color:var(--muted);margin:0;font-size:.92rem;}

  .progress-bar{
    height:8px;
    background:var(--panel2);
    border-radius:99px;
    overflow:hidden;
    margin:18px 0 4px;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,#3ea6ff,#7ee787);
    width:0%;
    transition:width .3s ease;
  }
  .meta-row{
    display:flex;justify-content:space-between;
    font-size:.8rem;color:var(--muted);margin-bottom:18px;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:24px 22px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .qnum{
    display:inline-block;
    font-size:.72rem;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--accent);
    background:rgba(62,166,255,.12);
    padding:3px 10px;
    border-radius:99px;
    margin-bottom:12px;
  }
  .qtext{
    font-size:1.12rem;
    line-height:1.5;
    margin:0 0 18px;
    font-weight:600;
  }
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{
    text-align:left;
    background:var(--panel2);
    border:1.5px solid var(--border);
    color:var(--ink);
    padding:13px 16px;
    border-radius:10px;
    font-size:.98rem;
    cursor:pointer;
    transition:all .15s ease;
    display:flex;gap:10px;align-items:flex-start;
  }
  .opt:hover:not(:disabled){border-color:var(--accent);background:#20303e;}
  .opt:disabled{cursor:default;}
  .opt .lab{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:#0e1a24;
    display:flex;align-items:center;justify-content:center;
    font-size:.78rem;font-weight:700;color:var(--muted);
    border:1px solid var(--border);
  }
  .opt.correct{background:var(--good-bg);border-color:var(--good);}
  .opt.correct .lab{background:var(--good);color:#04240f;border-color:var(--good);}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad);}
  .opt.wrong .lab{background:var(--bad);color:#2b0808;border-color:var(--bad);}

  .footer-row{
    display:flex;justify-content:flex-end;
    margin-top:18px;
  }
  .btn{
    background:var(--accent);
    color:#04141f;
    border:none;
    padding:10px 22px;
    border-radius:10px;
    font-size:.95rem;
    font-weight:700;
    cursor:pointer;
    transition:transform .1s ease, opacity .2s;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn.ghost{
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--border);
  }
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

  .hidden{display:none !important;}

  /* Results screen */
  .score-hero{
    text-align:center;
    padding:10px 0 6px;
  }
  .score-num{
    font-size:3rem;
    font-weight:800;
    background:linear-gradient(90deg,#3ea6ff,#7ee787);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .score-sub{color:var(--muted);font-size:.95rem;}

  .tabs{
    display:flex;gap:8px;margin:20px 0 14px;
  }
  .tab{
    flex:1;
    padding:10px;
    text-align:center;
    border-radius:10px;
    border:1.5px solid var(--border);
    cursor:pointer;
    font-size:.9rem;font-weight:600;
    color:var(--muted);
    background:var(--panel2);
  }
  .tab.active{
    color:var(--ink);
  }
  .tab.tab-correct.active{border-color:var(--good);background:var(--good-bg);color:var(--good);}
  .tab.tab-wrong.active{border-color:var(--bad);background:var(--bad-bg);color:var(--bad);}

  .review-item{
    background:var(--panel2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:12px;
  }
  .review-item .qtext{font-size:1rem;margin-bottom:10px;}
  .review-opt{
    padding:8px 12px;border-radius:8px;font-size:.9rem;margin-bottom:6px;
    display:flex;gap:8px;
  }
  .review-opt.correct{background:var(--good-bg);color:var(--good);}
  .review-opt.wrong{background:var(--bad-bg);color:var(--bad);}
  .note{
    font-size:.78rem;color:#f5b73f;margin-top:8px;
    background:rgba(245,183,63,.08);
    border-left:3px solid #f5b73f;
    padding:6px 10px;border-radius:6px;
  }
  .empty{
    text-align:center;color:var(--muted);padding:30px 10px;
  }
  .restart-row{
    margin-top:22px;display:flex;justify-content:center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>⚛ Physics MCQ Quiz</h1>
    <p>NED Past Papers — mixed order</p>
  </header>

  <div id="quizScreen">
    <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
    <div class="meta-row">
      <span id="qCounter">Question 1 / 1</span>
      <span id="scoreLive">Score: 0</span>
    </div>
    <div class="card">
      <span class="qnum" id="qBadge">Q1</span>
      <p class="qtext" id="qText"></p>
      <div class="options" id="optsWrap"></div>
    </div>
    <div class="footer-row">
      <button class="btn" id="nextBtn" disabled>Next →</button>
    </div>
  </div>

  <div id="resultScreen" class="hidden">
    <div class="card">
      <div class="score-hero">
        <div class="score-num" id="finalScore">0/0</div>
        <div class="score-sub" id="finalPct">0% correct</div>
      </div>
      <div class="tabs">
        <div class="tab tab-correct active" id="tabCorrect">✅ Correct (<span id="cCount">0</span>)</div>
        <div class="tab tab-wrong" id="tabWrong">❌ Incorrect (<span id="wCount">0</span>)</div>
      </div>
      <div id="reviewList"></div>
    </div>
    <div class="restart-row">
      <button class="btn ghost" id="restartBtn">↻ Restart quiz (reshuffle)</button>
    </div>
  </div>
</div>

<script>
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

const progFill = document.getElementById('progFill');
const qCounter = document.getElementById('qCounter');
const scoreLive = document.getElementById('scoreLive');

function initQuiz(){
  // shuffle question order, and shuffle option order within each question
  const base = shuffle(QUESTIONS);
  quizQuestions = base.map(item => {
    const optIdx = item.options.map((opt,i)=>({opt,i}));
    const shuffled = shuffle(optIdx);
    const newCorrectIndex = shuffled.findIndex(o => o.i === item.correct);
    return {
      q: item.q,
      note: item.note || null,
      options: shuffled.map(o=>o.opt),
      correct: newCorrectIndex
    };
  });
  current = 0;
  answers = [];
  document.getElementById('quizScreen').classList.remove('hidden');
  document.getElementById('resultScreen').classList.add('hidden');
  renderQuestion();
}

function renderQuestion(){
  const item = quizQuestions[current];
  qBadge.textContent = 'Q' + (current+1);
  qText.textContent = item.q;
  qCounter.textContent = `Question ${current+1} / ${quizQuestions.length}`;
  const correctSoFar = answers.filter(a=>a.isCorrect).length;
  scoreLive.textContent = `Score: ${correctSoFar}`;
  progFill.style.width = ((current)/quizQuestions.length*100) + '%';

  optsWrap.innerHTML = '';
  const labels = ['A','B','C','D'];
  item.options.forEach((opt, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = `<span class="lab">${labels[idx]}</span><span>${opt}</span>`;
    btn.addEventListener('click', ()=>selectOption(idx));
    optsWrap.appendChild(btn);
  });
  nextBtn.disabled = true;
  nextBtn.textContent = (current === quizQuestions.length-1) ? 'See Results →' : 'Next →';
}

function selectOption(idx){
  const item = quizQuestions[current];
  const isCorrect = idx === item.correct;
  const allBtns = optsWrap.querySelectorAll('.opt');
  allBtns.forEach((b,i)=>{
    b.disabled = true;
    if(i === item.correct) b.classList.add('correct');
    if(i === idx && !isCorrect) b.classList.add('wrong');
  });
  answers.push({
    q: item.q,
    options: item.options,
    chosenIndex: idx,
    correctIndex: item.correct,
    isCorrect,
    note: item.note
  });
  const correctSoFar = answers.filter(a=>a.isCorrect).length;
  scoreLive.textContent = `Score: ${correctSoFar}`;
  nextBtn.disabled = false;
}

nextBtn.addEventListener('click', ()=>{
  if(current < quizQuestions.length-1){
    current++;
    renderQuestion();
  } else {
    showResults();
  }
});

function showResults(){
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  const correct = answers.filter(a=>a.isCorrect);
  const wrong = answers.filter(a=>!a.isCorrect);
  document.getElementById('finalScore').textContent = `${correct.length}/${answers.length}`;
  document.getElementById('finalPct').textContent = `${Math.round(correct.length/answers.length*100)}% correct`;
  document.getElementById('cCount').textContent = correct.length;
  document.getElementById('wCount').textContent = wrong.length;
  renderReview('correct');
}

function renderReview(which){
  document.getElementById('tabCorrect').classList.toggle('active', which==='correct');
  document.getElementById('tabWrong').classList.toggle('active', which==='wrong');
  const list = which==='correct' ? answers.filter(a=>a.isCorrect) : answers.filter(a=>!a.isCorrect);
  const container = document.getElementById('reviewList');
  container.innerHTML = '';
  if(list.length === 0){
    container.innerHTML = `<div class="empty">${which==='correct' ? 'No correct answers yet.' : '🎉 No incorrect answers — perfect run!'}</div>`;
    return;
  }
  const labels = ['A','B','C','D'];
  list.forEach(a=>{
    const div = document.createElement('div');
    div.className = 'review-item';
    let optsHtml = '';
    a.options.forEach((opt,i)=>{
      if(i === a.correctIndex){
        optsHtml += `<div class="review-opt correct">${labels[i]}. ${opt} ✓</div>`;
      } else if(i === a.chosenIndex && !a.isCorrect){
        optsHtml += `<div class="review-opt wrong">${labels[i]}. ${opt} ✗ (your answer)</div>`;
      }
    });
    div.innerHTML = `<p class="qtext">${a.q}</p>${optsHtml}${a.note ? `<div class="note">⚠ ${a.note}</div>` : ''}`;
    container.appendChild(div);
  });
}

document.getElementById('tabCorrect').addEventListener('click', ()=>renderReview('correct'));
document.getElementById('tabWrong').addEventListener('click', ()=>renderReview('wrong'));
document.getElementById('restartBtn').addEventListener('click', initQuiz);

initQuiz();
</script>
</body>
</html>
