<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics MCQ Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161923;
    --surface2: #1e2433;
    --border: #2a3147;
    --accent: #5b8cff;
    --accent2: #7c3aed;
    --correct: #22c55e;
    --wrong: #ef4444;
    --text: #e8ecf4;
    --muted: #7a85a0;
    --gold: #f59e0b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    background-image: radial-gradient(ellipse at 20% 0%, rgba(91,140,255,0.08) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 100%, rgba(124,58,237,0.07) 0%, transparent 60%);
  }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(13,15,20,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  header h1 {
    font-family: 'Syne', sans-serif;
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: 0.05em;
    background: linear-gradient(90deg, #5b8cff, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    white-space: nowrap;
  }

  .score-bar {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-shrink: 0;
  }

  .score-chip {
    font-family: 'DM Mono', monospace;
    font-size: 0.78rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 12px;
  }

  .score-chip .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
  }

  .dot-correct { background: var(--correct); }
  .dot-wrong { background: var(--wrong); }
  .dot-total { background: var(--accent); }

  .progress-wrap {
    flex: 1;
    max-width: 300px;
    height: 4px;
    background: var(--surface2);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.4s ease;
    width: 0%;
  }

  .container {
    max-width: 820px;
    margin: 0 auto;
    padding: 36px 20px 80px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: border-color 0.3s;
  }

  .q-card.answered-correct { border-color: rgba(34,197,94,0.35); }
  .q-card.answered-wrong   { border-color: rgba(239,68,68,0.25); }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 20px 22px 16px;
    border-bottom: 1px solid var(--border);
  }

  .q-num {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    font-weight: 500;
    color: var(--accent);
    background: rgba(91,140,255,0.1);
    border: 1px solid rgba(91,140,255,0.25);
    border-radius: 6px;
    padding: 3px 8px;
    white-space: nowrap;
    margin-top: 2px;
    flex-shrink: 0;
  }

  .q-text {
    font-size: 0.97rem;
    font-weight: 500;
    line-height: 1.6;
    color: var(--text);
  }

  .q-options {
    padding: 14px 22px 18px;
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .opt-btn {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px;
    cursor: pointer;
    transition: all 0.18s ease;
    text-align: left;
    width: 100%;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.92rem;
    line-height: 1.5;
  }

  .opt-btn:not(.disabled):hover {
    border-color: var(--accent);
    background: rgba(91,140,255,0.07);
    transform: translateX(2px);
  }

  .opt-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--muted);
    background: rgba(255,255,255,0.05);
    border-radius: 5px;
    padding: 2px 7px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .opt-btn.correct {
    border-color: var(--correct);
    background: rgba(34,197,94,0.1);
  }
  .opt-btn.correct .opt-label { color: var(--correct); background: rgba(34,197,94,0.15); }

  .opt-btn.wrong {
    border-color: var(--wrong);
    background: rgba(239,68,68,0.09);
  }
  .opt-btn.wrong .opt-label { color: var(--wrong); background: rgba(239,68,68,0.15); }

  .opt-btn.revealed-correct {
    border-color: rgba(34,197,94,0.5);
    background: rgba(34,197,94,0.06);
  }
  .opt-btn.revealed-correct .opt-label { color: var(--correct); }

  .opt-btn.disabled { cursor: default; }

  .icon {
    font-size: 1rem;
    flex-shrink: 0;
    margin-left: auto;
    padding-left: 8px;
  }

  .feedback-bar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 22px;
    font-size: 0.85rem;
    font-weight: 500;
    border-top: 1px solid var(--border);
  }

  .feedback-bar.show { display: flex; }
  .feedback-bar.fb-correct { color: var(--correct); }
  .feedback-bar.fb-wrong   { color: var(--wrong); }
  .fb-icon { font-size: 1rem; }

  .note-box {
    font-size: 0.8rem;
    color: var(--gold);
    background: rgba(245,158,11,0.07);
    border: 1px solid rgba(245,158,11,0.2);
    border-radius: 8px;
    padding: 8px 12px;
    margin: 0 22px 14px;
    display: none;
  }

  .note-box.show { display: block; }

  /* Summary card at top */
  .summary-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px 28px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 20px;
    text-align: center;
  }

  .sum-stat { }
  .sum-val {
    font-family: 'Syne', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    display: block;
  }
  .sum-lbl {
    font-size: 0.78rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .sum-val.c { color: var(--correct); }
  .sum-val.w { color: var(--wrong); }
  .sum-val.t { color: var(--accent); }
  .sum-val.p { color: var(--gold); }

  @media (max-width: 600px) {
    header { flex-wrap: wrap; }
    .progress-wrap { display: none; }
    .q-text { font-size: 0.9rem; }
    .opt-btn { font-size: 0.87rem; }
  }
</style>
</head>

const labels = ['A', 'B', 'C', 'D'];
let correct = 0, wrong = 0, answered = 0;

function updateStats() {
  const pct = answered > 0 ? Math.round((correct / answered) * 100) : 0;
  document.getElementById('hdr-correct').textContent = correct;
  document.getElementById('hdr-wrong').textContent = wrong;
  document.getElementById('hdr-answered').textContent = answered;
  document.getElementById('stat-correct').textContent = correct;
  document.getElementById('stat-wrong').textContent = wrong;
  document.getElementById('stat-pct').textContent = pct + '%';
  document.getElementById('prog-fill').style.width = (answered / 76 * 100) + '%';
}

function buildQuiz() {
  const root = document.getElementById('quiz-root');
  questions.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'card-' + idx;

    const header = document.createElement('div');
    header.className = 'q-header';
    header.innerHTML = `<span class="q-num">Q${q.n}</span><span class="q-text">${q.q}</span>`;
    card.appendChild(header);

    const optWrap = document.createElement('div');
    optWrap.className = 'q-options';

    q.opts.forEach((opt, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerHTML = `<span class="opt-label">${labels[oi]}</span><span class="opt-text">${opt}</span><span class="icon" id="icon-${idx}-${oi}"></span>`;
      btn.addEventListener('click', () => handleAnswer(idx, oi, btn));
      btn.id = `btn-${idx}-${oi}`;
      optWrap.appendChild(btn);
    });

    card.appendChild(optWrap);

    // feedback bar
    const fb = document.createElement('div');
    fb.className = 'feedback-bar';
    fb.id = 'fb-' + idx;
    card.appendChild(fb);

    // note box
    if (q.note) {
      const nb = document.createElement('div');
      nb.className = 'note-box';
      nb.id = 'note-' + idx;
      nb.innerHTML = '📝 ' + q.note;
      card.appendChild(nb);
    }

    root.appendChild(card);
  });
}

const answeredSet = new Set();

function handleAnswer(idx, chosen, btn) {
  if (answeredSet.has(idx)) return;
  answeredSet.add(idx);
  answered++;

  const q = questions[idx];
  const card = document.getElementById('card-' + idx);
  const fb = document.getElementById('fb-' + idx);
  const isCorrect = chosen === q.ans;

  if (isCorrect) correct++;
  else wrong++;

  // Disable all buttons
  q.opts.forEach((_, oi) => {
    const b = document.getElementById(`btn-${idx}-${oi}`);
    b.classList.add('disabled');

    if (oi === q.ans) {
      b.classList.add(chosen === q.ans && oi === chosen ? 'correct' : 'revealed-correct');
      document.getElementById(`icon-${idx}-${oi}`).textContent = '✓';
    }
    if (oi === chosen && chosen !== q.ans) {
      b.classList.add('wrong');
      document.getElementById(`icon-${idx}-${oi}`).textContent = '✗';
    }
  });

  // Mark chosen correct
  if (isCorrect) {
    document.getElementById(`btn-${idx}-${chosen}`).classList.remove('revealed-correct');
    document.getElementById(`btn-${idx}-${chosen}`).classList.add('correct');
  }

  card.classList.add(isCorrect ? 'answered-correct' : 'answered-wrong');

  fb.className = 'feedback-bar show ' + (isCorrect ? 'fb-correct' : 'fb-wrong');
  fb.innerHTML = isCorrect
    ? `<span class="fb-icon">✅</span> Correct! Well done.`
    : `<span class="fb-icon">❌</span> Incorrect. The correct answer is <strong>${labels[q.ans]}. ${q.opts[q.ans]}</strong>`;

  if (q.note) {
    document.getElementById('note-' + idx).classList.add('show');
  }

  updateStats();
}

buildQuiz();
updateStats();
</script>
