<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics MCQ Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f1a;
    --surface: #141724;
    --card: #1a1f35;
    --border: #252b45;
    --accent: #6c8eff;
    --accent2: #a78bfa;
    --correct: #22d3a0;
    --wrong: #f43f5e;
    --text: #e8ecf5;
    --muted: #6b7394;
    --gold: #f5c842;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 80px 0;
  }

  /* HEADER */
  .hero {
    background: linear-gradient(135deg, #0d0f1a 0%, #141030 50%, #0d1a2a 100%);
    border-bottom: 1px solid var(--border);
    padding: 48px 24px 36px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -60px; left: 50%; transform: translateX(-50%);
    width: 600px; height: 300px;
    background: radial-gradient(ellipse, rgba(108,142,255,0.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-badge {
    display: inline-block;
    background: rgba(108,142,255,0.12);
    border: 1px solid rgba(108,142,255,0.3);
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 5px 16px;
    border-radius: 20px;
    margin-bottom: 20px;
  }
  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(32px, 6vw, 56px);
    font-weight: 900;
    line-height: 1.1;
    background: linear-gradient(135deg, #e8ecf5 30%, #6c8eff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 12px;
  }
  .hero p {
    color: var(--muted);
    font-size: 15px;
    font-weight: 300;
  }

  /* SCOREBOARD */
  .scoreboard {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 24px 20px 0;
    max-width: 900px;
    margin: 0 auto;
  }
  .score-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 24px;
    text-align: center;
    min-width: 110px;
    flex: 1;
    max-width: 180px;
  }
  .score-card .label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .score-card .value {
    font-size: 28px;
    font-weight: 700;
    font-family: 'Playfair Display', serif;
  }
  .score-card.total .value { color: var(--accent); }
  .score-card.correct .value { color: var(--correct); }
  .score-card.wrong .value { color: var(--wrong); }
  .score-card.remaining .value { color: var(--gold); }

  /* PROGRESS */
  .progress-wrap {
    max-width: 900px;
    margin: 20px auto 0;
    padding: 0 20px;
  }
  .progress-bar-bg {
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.4s ease;
    width: 0%;
  }
  .progress-label {
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    margin-top: 6px;
  }

  /* QUIZ CONTAINER */
  .quiz {
    max-width: 900px;
    margin: 32px auto 0;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* QUESTION CARD */
  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 28px 24px;
    transition: border-color 0.3s;
    position: relative;
    overflow: hidden;
  }
  .q-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    opacity: 0;
    transition: opacity 0.3s;
  }
  .q-card.answered::before { opacity: 1; }
  .q-card.answered { border-color: rgba(108,142,255,0.3); }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 22px;
  }
  .q-num {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    min-width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    text-align: center;
    line-height: 1.2;
    padding: 4px;
  }
  .q-text {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.65;
    color: var(--text);
    padding-top: 10px;
  }

  /* OPTIONS */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .opt {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 13px 18px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-size: 14px;
    font-weight: 400;
    color: var(--text);
    text-align: left;
    width: 100%;
    position: relative;
  }
  .opt:hover:not(.disabled) {
    border-color: var(--accent);
    background: rgba(108,142,255,0.07);
    transform: translateX(3px);
  }
  .opt-letter {
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--border);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--muted);
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .opt-text { flex: 1; line-height: 1.5; }
  .opt-icon {
    font-size: 16px;
    opacity: 0;
    transition: opacity 0.2s;
    flex-shrink: 0;
  }

  /* States */
  .opt.correct {
    background: rgba(34,211,160,0.1);
    border-color: var(--correct);
    cursor: default;
  }
  .opt.correct .opt-letter {
    background: var(--correct);
    color: #fff;
  }
  .opt.correct .opt-icon { opacity: 1; color: var(--correct); }

  .opt.wrong {
    background: rgba(244,63,94,0.1);
    border-color: var(--wrong);
    cursor: default;
  }
  .opt.wrong .opt-letter {
    background: var(--wrong);
    color: #fff;
  }
  .opt.wrong .opt-icon { opacity: 1; color: var(--wrong); }

  .opt.disabled:not(.correct):not(.wrong) {
    opacity: 0.45;
    cursor: default;
  }

  /* Feedback */
  .feedback {
    display: none;
    margin-top: 16px;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.5;
    align-items: center;
    gap: 10px;
  }
  .feedback.show { display: flex; }
  .feedback.fb-correct {
    background: rgba(34,211,160,0.1);
    border: 1px solid rgba(34,211,160,0.3);
    color: var(--correct);
  }
  .feedback.fb-wrong {
    background: rgba(244,63,94,0.08);
    border: 1px solid rgba(244,63,94,0.25);
    color: #f87171;
  }
  .feedback-icon { font-size: 18px; flex-shrink: 0; }

  /* RESET BUTTON */
  .reset-wrap {
    text-align: center;
    padding: 40px 20px 0;
  }
  .reset-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    padding: 14px 40px;
    border-radius: 50px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, opacity 0.2s;
    font-family: 'DM Sans', sans-serif;
  }
  .reset-btn:hover { transform: translateY(-2px); opacity: 0.9; }

  @media (max-width: 600px) {
    .q-card { padding: 20px 18px 18px; }
    .opt { padding: 11px 14px; font-size: 13px; }
  }
</style>
</head>

const letters = ['A','B','C','D'];
let correctCount = 0, wrongCount = 0, answeredCount = 0;
const total = questions.length;

function updateScore() {
  document.getElementById('sc-correct').textContent = correctCount;
  document.getElementById('sc-wrong').textContent = wrongCount;
  document.getElementById('sc-rem').textContent = total - answeredCount;
  const pct = (answeredCount / total * 100).toFixed(1);
  document.getElementById('prog').style.width = pct + '%';
  document.getElementById('prog-label').textContent = `${answeredCount} / ${total} answered`;
}

function buildQuiz() {
  const quiz = document.getElementById('quiz');
  quiz.innerHTML = '';
  questions.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'card-' + qi;

    const header = document.createElement('div');
    header.className = 'q-header';

    const num = document.createElement('div');
    num.className = 'q-num';
    num.textContent = 'Q' + q.n;

    const text = document.createElement('div');
    text.className = 'q-text';
    text.textContent = q.q;

    header.appendChild(num);
    header.appendChild(text);
    card.appendChild(header);

    const opts = document.createElement('div');
    opts.className = 'options';

    q.opts.forEach((opt, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.id = `opt-${qi}-${oi}`;
      btn.innerHTML = `
        <span class="opt-letter">${letters[oi]}</span>
        <span class="opt-text">${opt}</span>
        <span class="opt-icon">${oi === q.ans ? '✓' : '✗'}</span>
      `;
      btn.onclick = () => selectOpt(qi, oi);
      opts.appendChild(btn);
    });

    card.appendChild(opts);

    const fb = document.createElement('div');
    fb.className = 'feedback';
    fb.id = 'fb-' + qi;
    card.appendChild(fb);

    quiz.appendChild(card);
  });
  updateScore();
}

function selectOpt(qi, chosen) {
  const q = questions[qi];
  const card = document.getElementById('card-' + qi);
  if (card.classList.contains('answered')) return;

  card.classList.add('answered');
  answeredCount++;

  const isCorrect = chosen === q.ans;
  if (isCorrect) correctCount++; else wrongCount++;

  // Style all options
  q.opts.forEach((_, oi) => {
    const btn = document.getElementById(`opt-${qi}-${oi}`);
    btn.classList.add('disabled');
    if (oi === q.ans) {
      btn.classList.add('correct');
    } else if (oi === chosen && !isCorrect) {
      btn.classList.add('wrong');
    }
  });

  // Feedback
  const fb = document.getElementById('fb-' + qi);
  if (isCorrect) {
    fb.className = 'feedback fb-correct show';
    fb.innerHTML = `<span class="feedback-icon">✅</span> <span>Correct! <strong>${letters[q.ans]}. ${q.opts[q.ans]}</strong> is the right answer.</span>`;
  } else {
    fb.className = 'feedback fb-wrong show';
    fb.innerHTML = `<span class="feedback-icon">❌</span> <span>Incorrect. The correct answer is <strong>${letters[q.ans]}. ${q.opts[q.ans]}</strong>.</span>`;
  }

  updateScore();
}

function resetQuiz() {
  correctCount = 0; wrongCount = 0; answeredCount = 0;
  buildQuiz();
}

buildQuiz();
</script>
