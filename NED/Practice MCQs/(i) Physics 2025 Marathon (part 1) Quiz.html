<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics 2025 Marathon Quiz — NED CBT</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --card: #16161f;
    --border: #252535;
    --accent: #7c6af7;
    --accent2: #e85d75;
    --correct: #22c97a;
    --wrong: #e85d75;
    --text: #e8e8f0;
    --muted: #8888aa;
    --gold: #f5c842;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 0 0 80px;
  }

  /* BG texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 20% 10%, rgba(124,106,247,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 90%, rgba(232,93,117,0.06) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,15,0.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }

  .header-left h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.02em;
  }

  .header-left p {
    font-size: 0.72rem;
    color: var(--muted);
    margin-top: 2px;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.05em;
  }

  .score-board {
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .score-pill {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .score-pill .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  .dot-correct { background: var(--correct); box-shadow: 0 0 6px var(--correct); }
  .dot-wrong { background: var(--wrong); box-shadow: 0 0 6px var(--wrong); }
  .dot-total { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

  #progress-bar-wrap {
    width: 100%;
    height: 3px;
    background: var(--border);
    position: fixed;
    top: 0;
    left: 0;
    z-index: 200;
  }

  #progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    width: 0%;
    transition: width 0.4s ease;
  }

  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 40px 20px 0;
    position: relative;
    z-index: 1;
  }

  .section-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 24px;
    padding: 6px 12px;
    border: 1px solid rgba(124,106,247,0.3);
    border-radius: 4px;
    display: inline-block;
  }

  .quiz-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 28px 22px;
    margin-bottom: 20px;
    position: relative;
    transition: border-color 0.3s;
  }

  .quiz-card:hover {
    border-color: rgba(124,106,247,0.3);
  }

  .quiz-card.answered-correct {
    border-color: rgba(34,201,122,0.4);
    background: linear-gradient(135deg, #16161f, #0f1f18);
  }

  .quiz-card.answered-wrong {
    border-color: rgba(232,93,117,0.35);
    background: linear-gradient(135deg, #16161f, #1f0f14);
  }

  .q-number {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    color: var(--muted);
    letter-spacing: 0.08em;
    margin-bottom: 10px;
  }

  .q-text {
    font-size: 1rem;
    font-weight: 500;
    line-height: 1.55;
    color: var(--text);
    margin-bottom: 20px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }

  .opt-btn {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    text-align: left;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .opt-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(124,106,247,0.06), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .opt-btn:hover:not(:disabled)::before { opacity: 1; }
  .opt-btn:hover:not(:disabled) {
    border-color: rgba(124,106,247,0.5);
    transform: translateX(3px);
  }

  .opt-btn:disabled { cursor: default; transform: none !important; }

  .opt-letter {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--muted);
    min-width: 22px;
    padding-top: 1px;
    transition: color 0.2s;
  }

  .opt-btn.correct {
    background: rgba(34,201,122,0.12);
    border-color: var(--correct);
    color: #b8f5d8;
  }

  .opt-btn.correct .opt-letter { color: var(--correct); }

  .opt-btn.wrong {
    background: rgba(232,93,117,0.12);
    border-color: var(--wrong);
    color: #f5b8c4;
  }

  .opt-btn.wrong .opt-letter { color: var(--wrong); }

  .opt-btn.reveal-correct {
    background: rgba(34,201,122,0.08);
    border-color: rgba(34,201,122,0.5);
    color: #b8f5d8;
  }

  .opt-btn.reveal-correct .opt-letter { color: var(--correct); }

  .feedback {
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.83rem;
    font-weight: 500;
    display: none;
    align-items: center;
    gap: 8px;
  }

  .feedback.show { display: flex; animation: fadeIn 0.3s ease; }

  .feedback.correct-fb {
    background: rgba(34,201,122,0.1);
    border: 1px solid rgba(34,201,122,0.3);
    color: #22c97a;
  }

  .feedback.wrong-fb {
    background: rgba(232,93,117,0.1);
    border: 1px solid rgba(232,93,117,0.3);
    color: #e85d75;
  }

  .result-banner {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 14px 32px;
    display: flex;
    gap: 24px;
    align-items: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    z-index: 99;
    font-size: 0.88rem;
    backdrop-filter: blur(16px);
  }

  .result-banner span { display: flex; align-items: center; gap: 6px; }
  .result-banner .r-correct { color: var(--correct); font-weight: 600; }
  .result-banner .r-wrong { color: var(--wrong); font-weight: 600; }
  .result-banner .r-unanswered { color: var(--muted); }
  .result-banner .r-score { color: var(--gold); font-weight: 700; font-family: 'DM Mono', monospace; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .opt-icon {
    margin-left: auto;
    font-size: 1rem;
    flex-shrink: 0;
  }

  /* Scroll to top */
  #scrollTop {
    position: fixed;
    bottom: 90px;
    right: 24px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    width: 40px; height: 40px;
    border-radius: 50%;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    z-index: 50;
  }
  #scrollTop:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>

  },
  {
    q: "Angular momentum of a particle is defined as:",
    opts: ["L = m × v","L = r × v","L = r × p","L = m × r²"],
    ans: 2
  },
  {
    q: "The time period of a simple pendulum depends upon the _____:",
    opts: ["Length of the pendulum","Mass of the pendulum bob","Tension in the string of the pendulum","Density of the material of the pendulum"],
    ans: 0
  },
  {
    q: "In Compton effect _____:",
    opts: ["The scattered photon has frequency less than that of the incident photon","The scattered photon has frequency greater than that of the incident photon","The scattered photon has frequency equal to the incident photon","None of these"],
    ans: 0
  },
  {
    q: "A wave with frequency 500 Hz travels in a medium with a speed of 1500 m/s. What is its wavelength?",
    opts: ["0.3 m","3 m","30 m","300 m"],
    ans: 1
  },
  {
    q: "Hyperopia is the condition in which _____:",
    opts: ["Nearby objects are seen clearly but distant objects appear blurred","The image forms in front of the retina","The eye lens becomes too convex","Distant objects are seen clearly but nearby objects appear blurred"],
    ans: 3
  },
  {
    q: "Wheatstone bridge is most sensitive when the resistance of all four arms are:",
    opts: ["Greater than 10 Ω","Less than 10 Ω","Same","None of the above"],
    ans: 2
  },
  {
    q: "If the least distance of distinct vision is 25 cm and a simple microscope has a focal length of 5 cm, what is its magnifying power?",
    opts: ["4","5","6","7"],
    ans: 2
  }
];

const letters = ['A','B','C','D'];
let correct = 0, wrong = 0, answered = 0;

function updateScores() {
  document.getElementById('sc-correct').textContent = correct;
  document.getElementById('sc-wrong').textContent = wrong;
  document.getElementById('sc-done').textContent = answered;
  document.getElementById('rb-correct').textContent = correct;
  document.getElementById('rb-wrong').textContent = wrong;
  document.getElementById('rb-unanswered').textContent = 74 - answered;
  const pct = answered > 0 ? Math.round((correct / answered) * 100) : 0;
  document.getElementById('rb-score').textContent = answered > 0 ? Math.round((correct/74)*100) + '%' : '0%';
  document.getElementById('progress-bar').style.width = ((answered/74)*100) + '%';
}

function buildQuiz() {
  const container = document.getElementById('quiz-container');
  questions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'quiz-card';
    card.id = `card-${i}`;

    const qNum = document.createElement('div');
    qNum.className = 'q-number';
    qNum.textContent = `Q${String(i+1).padStart(2,'0')} / 74`;

    const qText = document.createElement('div');
    qText.className = 'q-text';
    qText.textContent = q.q;

    const opts = document.createElement('div');
    opts.className = 'options';

    q.opts.forEach((opt, j) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.id = `q${i}-o${j}`;
      btn.innerHTML = `<span class="opt-letter">${letters[j]}</span><span>${opt}</span><span class="opt-icon"></span>`;
      btn.onclick = () => handleAnswer(i, j, q.ans);
      opts.appendChild(btn);
    });

    const fb = document.createElement('div');
    fb.className = 'feedback';
    fb.id = `fb-${i}`;

    card.appendChild(qNum);
    card.appendChild(qText);
    card.appendChild(opts);
    card.appendChild(fb);
    container.appendChild(card);
  });
}

function handleAnswer(qIdx, chosen, correct_ans) {
  const card = document.getElementById(`card-${qIdx}`);
  const fb = document.getElementById(`fb-${qIdx}`);
  const allBtns = card.querySelectorAll('.opt-btn');

  // Disable all buttons
  allBtns.forEach(b => b.disabled = true);

  answered++;

  if (chosen === correct_ans) {
    correct++;
    allBtns[chosen].classList.add('correct');
    allBtns[chosen].querySelector('.opt-icon').textContent = '✅';
    fb.className = 'feedback correct-fb show';
    fb.innerHTML = '✅ Correct! Well done.';
    card.classList.add('answered-correct');
  } else {
    wrong++;
    allBtns[chosen].classList.add('wrong');
    allBtns[chosen].querySelector('.opt-icon').textContent = '❌';
    // Reveal correct
    allBtns[correct_ans].classList.add('reveal-correct');
    allBtns[correct_ans].querySelector('.opt-icon').textContent = '✅';
    fb.className = 'feedback wrong-fb show';
    fb.innerHTML = `❌ Incorrect! The correct answer is <strong>${letters[correct_ans]}. ${questions[qIdx].opts[correct_ans]}</strong>`;
    card.classList.add('answered-wrong');
  }

  updateScores();
}

buildQuiz();
updateScores();
</script>
