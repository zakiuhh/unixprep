<title>NED Chemistry Past Papers — Practice Quiz</title>
<style>
  :root{
    --bg:#0f1419;
    --card:#161d27;
    --accent:#2dd4bf;
    --accent2:#f4b942;
    --text:#e6edf3;
    --muted:#8b98a5;
    --correct:#22c55e;
    --wrong:#ef4444;
    --border:#26303b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px 12px 60px;
  }
  .wrap{max-width:800px;margin:0 auto;}
  header{
    text-align:center;
    margin-bottom:24px;
  }
  header h1{
    font-size:1.5rem;
    margin:0 0 6px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header p{color:var(--muted);margin:0;font-size:0.9rem;}

  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:20px;
  }
  select, button{
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);
    padding:8px 14px;
    border-radius:8px;
    font-size:0.9rem;
    cursor:pointer;
  }
  button.primary{
    background: var(--accent);
    color:#04231e;
    font-weight:600;
    border:none;
  }
  button.primary:hover{opacity:0.9;}

  .progress-bar{
    height:8px;
    background:var(--card);
    border-radius:6px;
    overflow:hidden;
    margin-bottom:20px;
    border:1px solid var(--border);
  }
  .progress-fill{
    height:100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    width:0%;
    transition: width 0.3s;
  }

  .score-banner{
    display:none;
    text-align:center;
    padding:20px;
    background:var(--card);
    border-radius:12px;
    border:1px solid var(--border);
    margin-bottom:20px;
  }
  .score-banner h2{margin:0 0 8px;font-size:2rem;color:var(--accent2);}
  .score-banner p{margin:0;color:var(--muted);}

  .q-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:18px;
    margin-bottom:14px;
  }
  .q-meta{
    font-size:0.72rem;
    color:var(--accent);
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin-bottom:6px;
  }
  .q-text{
    font-size:1rem;
    font-weight:600;
    margin-bottom:12px;
    line-height:1.4;
  }
  .opt{
    display:block;
    width:100%;
    text-align:left;
    background:#1d2733;
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 14px;
    border-radius:8px;
    margin-bottom:8px;
    cursor:pointer;
    font-size:0.92rem;
    transition: all 0.15s;
  }
  .opt:hover{border-color:var(--accent);}
  .opt.selected{border-color:var(--accent2);background:#2a2515;}
  .opt.correct{background:rgba(34,197,94,0.15);border-color:var(--correct);}
  .opt.wrong{background:rgba(239,68,68,0.15);border-color:var(--wrong);}
  .opt.disabled{cursor:default;}
  .opt .tag{float:right;font-size:0.75rem;color:var(--muted);}

  .flag{
    font-size:0.72rem;
    color:var(--accent2);
    margin-top:6px;
  }

  footer{
    text-align:center;
    margin-top:24px;
  }
  .hidden{display:none;}
  .section-divider{
    text-align:center;
    color:var(--muted);
    font-size:0.8rem;
    margin:26px 0 14px;
    text-transform:uppercase;
    letter-spacing:1px;
  }
</style>
</head>

// ---------------------------------------------------------------
let userAnswers = new Array(DATA.length).fill(null);
let currentPaperFilter = "ALL";

function uniquePapers(){
  const set = [...new Set(DATA.map(d=>d.paper))];
  return set;
}

function populateFilter(){
  const sel = document.getElementById('paperFilter');
  sel.innerHTML = '<option value="ALL">All Papers (' + DATA.length + ' Qs)</option>';
  uniquePapers().forEach(p=>{
    const count = DATA.filter(d=>d.paper===p).length;
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p + ' (' + count + ' Qs)';
    sel.appendChild(opt);
  });
}

function getFilteredIndices(){
  if(currentPaperFilter === "ALL") return DATA.map((_,i)=>i);
  return DATA.map((d,i)=> d.paper===currentPaperFilter ? i : -1).filter(i=>i>=0);
}

function render(){
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';
  const indices = getFilteredIndices();
  document.getElementById('subtitle').textContent = indices.length + ' questions loaded — select an option, then Submit to see your score.';

  indices.forEach((idx, order)=>{
    const item = DATA[idx];
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'card-' + idx;

    const meta = document.createElement('div');
    meta.className = 'q-meta';
    meta.textContent = item.paper + ' • Q' + (order+1);
    card.appendChild(meta);

    const qtext = document.createElement('div');
    qtext.className = 'q-text';
    qtext.textContent = item.q;
    card.appendChild(qtext);

    item.options.forEach((optText, oi)=>{
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = optText;
      btn.onclick = ()=>{
        if(userAnswers[idx] !== null) return; // lock after first pick
        userAnswers[idx] = oi;
        updateOptionStyles(idx, true);
        updateProgress();
      };
      card.appendChild(btn);
    });

    if(item.note){
      const flag = document.createElement('div');
      flag.className = 'flag';
      flag.textContent = '⚠ ' + item.note;
      card.appendChild(flag);
    }

    container.appendChild(card);
  });
  updateOptionStylesAll();
  updateProgress();
}

function updateOptionStylesAll(){
  getFilteredIndices().forEach(idx=>updateOptionStyles(idx));
}

function updateOptionStyles(idx, reveal=false){
  const card = document.getElementById('card-' + idx);
  if(!card) return;
  const opts = card.querySelectorAll('.opt');
  opts.forEach((btn, oi)=>{
    btn.classList.remove('selected','correct','wrong','disabled');
    if(userAnswers[idx] === oi){
      btn.classList.add('selected');
    }
    if(reveal){
      btn.classList.add('disabled');
      if(oi === DATA[idx].correct){
        btn.classList.add('correct');
      } else if(userAnswers[idx] === oi){
        btn.classList.add('wrong');
      }
    }
  });
}

function updateProgress(){
  const indices = getFilteredIndices();
  const answered = indices.filter(i=>userAnswers[i] !== null).length;
  const pct = indices.length ? (answered/indices.length*100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

function submitQuiz(){
  const indices = getFilteredIndices();
  let correct = 0;
  indices.forEach(idx=>{
    updateOptionStyles(idx, true);
    if(userAnswers[idx] === DATA[idx].correct) correct++;
  });
  document.getElementById('scoreBanner').style.display = 'block';
  document.getElementById('scoreText').textContent = correct + ' / ' + indices.length;
  const pct = indices.length ? Math.round(correct/indices.length*100) : 0;
  document.getElementById('scoreSub').textContent = pct + '% correct — scroll down to review answers (green = correct, red = your wrong pick)';
  document.getElementById('scoreBanner').scrollIntoView({behavior:'smooth'});
}

document.getElementById('paperFilter').addEventListener('change', (e)=>{
  currentPaperFilter = e.target.value;
  document.getElementById('scoreBanner').style.display = 'none';
  render();
});
document.getElementById('startBtn').addEventListener('click', ()=>{
  userAnswers = new Array(DATA.length).fill(null);
  document.getElementById('scoreBanner').style.display = 'none';
  render();
  window.scrollTo({top:0, behavior:'smooth'});
});
document.getElementById('submitBtn').addEventListener('click', submitQuiz);
document.getElementById('submitBtn2').addEventListener('click', submitQuiz);

populateFilter();
render();
</script>
