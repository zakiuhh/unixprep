<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #141720;
    --surface2: #1c2030;
    --border: #252a3a;
    --accent: #5b8df8;
    --accent2: #7c5bf8;
    --correct: #2dd4a0;
    --wrong: #f85b6e;
    --text: #e8eaf2;
    --muted: #6b7498;
    --tag: #1e2538;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 0 0 80px;
  }

  /* Header */
  header {
    background: linear-gradient(135deg, #0d0f14 0%, #131830 100%);
    border-bottom: 1px solid var(--border);
    padding: 32px 24px 24px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  .header-inner {
    max-width: 780px;
    margin: 0 auto;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .logo span { color: var(--muted); -webkit-text-fill-color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }

  .score-bar {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  .score-pill {
    background: var(--tag);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 6px 16px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .score-pill .dot { width: 7px; height: 7px; border-radius: 50%; }
  .dot-correct { background: var(--correct); box-shadow: 0 0 6px var(--correct); }
  .dot-wrong { background: var(--wrong); box-shadow: 0 0 6px var(--wrong); }

  .score-pill .val { font-weight: 500; color: var(--text); }

  .progress-wrap {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .progress-track {
    flex: 1;
    height: 3px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 3px;
    transition: width 0.4s ease;
    width: 0%;
  }

  .progress-label {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* Container */
  .container {
    max-width: 780px;
    margin: 0 auto;
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Question Card */
  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color 0.3s;
  }

  .q-card.answered-correct { border-color: rgba(45,212,160,0.3); }
  .q-card.answered-wrong { border-color: rgba(248,91,110,0.2); }

  .q-head {
    padding: 20px 24px 16px;
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }

  .q-num {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: rgba(91,141,248,0.1);
    border: 1px solid rgba(91,141,248,0.2);
    border-radius: 6px;
    padding: 3px 8px;
    white-space: nowrap;
    margin-top: 2px;
    letter-spacing: 0.5px;
  }

  .q-text {
    font-size: 14px;
    line-height: 1.65;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-weight: 400;
  }

  .q-options {
    padding: 4px 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 11px 14px;
    border-radius: 9px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.18s ease;
    background: var(--surface2);
    user-select: none;
  }

  .opt:hover:not(.disabled) {
    border-color: rgba(91,141,248,0.5);
    background: rgba(91,141,248,0.07);
    transform: translateX(2px);
  }

  .opt.disabled { cursor: default; }

  .opt-label {
    width: 22px;
    height: 22px;
    min-width: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 600;
    font-family: 'Syne', sans-serif;
    transition: all 0.18s;
    color: var(--muted);
  }

  .opt-text {
    font-size: 13px;
    line-height: 1.5;
    padding-top: 2px;
    color: var(--text);
  }

  /* Result states */
  .opt.correct {
    border-color: rgba(45,212,160,0.6);
    background: rgba(45,212,160,0.08);
  }

  .opt.correct .opt-label {
    background: var(--correct);
    border-color: var(--correct);
    color: #0d2820;
  }

  .opt.correct .opt-text { color: var(--correct); }

  .opt.wrong {
    border-color: rgba(248,91,110,0.4);
    background: rgba(248,91,110,0.06);
  }

  .opt.wrong .opt-label {
    background: var(--wrong);
    border-color: var(--wrong);
    color: #2d0a10;
  }

  .opt.wrong .opt-text { color: var(--wrong); }

  .opt.reveal-correct {
    border-color: rgba(45,212,160,0.4);
    background: rgba(45,212,160,0.05);
  }

  .opt.reveal-correct .opt-label {
    border-color: var(--correct);
    color: var(--correct);
  }

  .opt.reveal-correct .opt-text { color: rgba(45,212,160,0.8); }

  /* Feedback badge */
  .feedback {
    margin: 0 24px 16px;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 12px;
    display: none;
    align-items: center;
    gap: 8px;
    animation: slideIn 0.25s ease;
  }

  .feedback.show { display: flex; }

  .feedback.correct-fb {
    background: rgba(45,212,160,0.1);
    border: 1px solid rgba(45,212,160,0.25);
    color: var(--correct);
  }

  .feedback.wrong-fb {
    background: rgba(248,91,110,0.08);
    border: 1px solid rgba(248,91,110,0.2);
    color: var(--wrong);
  }

  .fb-icon { font-size: 14px; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Reset btn */
  .reset-btn {
    display: block;
    margin: 40px auto 0;
    padding: 14px 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    border-radius: 100px;
    color: white;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: opacity 0.2s, transform 0.2s;
  }

  .reset-btn:hover { opacity: 0.9; transform: translateY(-1px); }

  /* Final banner */
  .final-banner {
    display: none;
    background: linear-gradient(135deg, rgba(91,141,248,0.12), rgba(124,91,248,0.12));
    border: 1px solid rgba(91,141,248,0.3);
    border-radius: 14px;
    padding: 28px 24px;
    text-align: center;
    margin-top: 12px;
  }

  .final-banner.show { display: block; animation: slideIn 0.4s ease; }

  .final-banner h2 {
    font-family: 'Syne', sans-serif;
    font-size: 24px;
    font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }

  .final-banner p { color: var(--muted); font-size: 13px; }
  .final-score { font-size: 42px; font-family: 'Syne', sans-serif; font-weight: 800; color: var(--text); margin: 8px 0; }

  @media (max-width: 540px) {
    .q-text { font-size: 13px; }
    .opt-text { font-size: 12px; }
    header { padding: 20px 16px 16px; }
    .container { padding: 20px 16px; }
    .q-head, .q-options { padding-left: 16px; padding-right: 16px; }
    .feedback { margin-left: 16px; margin-right: 16px; }
  }
</style>
</head>

const labels = ['A', 'B', 'C', 'D'];
let answered = 0, correct = 0, wrong = 0;
const total = questions.length;

function updateScore() {
  document.getElementById('scoreCorrect').textContent = correct;
  document.getElementById('scoreWrong').textContent = wrong;
  document.getElementById('progressFill').style.width = (answered / total * 100) + '%';
  document.getElementById('progressLabel').textContent = `${answered} / ${total} answered`;

  if (answered === total) {
    document.getElementById('finalBanner').classList.add('show');
    document.getElementById('finalScore').textContent = `${correct} / ${total}`;
    const pct = Math.round(correct / total * 100);
    document.getElementById('finalPct').textContent = `${pct}% correct`;
  }
}

function render() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';

  questions.forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `card-${qi}`;

    const head = document.createElement('div');
    head.className = 'q-head';
    head.innerHTML = `<span class="q-num">Q${q.num}</span><span class="q-text">${q.text}</span>`;
    card.appendChild(head);

    const optsDiv = document.createElement('div');
    optsDiv.className = 'q-options';

    q.options.forEach((opt, oi) => {
      const btn = document.createElement('div');
      btn.className = 'opt';
      btn.id = `opt-${qi}-${oi}`;
      btn.innerHTML = `<span class="opt-label">${labels[oi]}</span><span class="opt-text">${opt}</span>`;
      btn.addEventListener('click', () => selectAnswer(qi, oi));
      optsDiv.appendChild(btn);
    });

    card.appendChild(optsDiv);

    const fb = document.createElement('div');
    fb.className = 'feedback';
    fb.id = `fb-${qi}`;
    card.appendChild(fb);

    container.appendChild(card);
  });

  // Final banner
  const banner = document.createElement('div');
  banner.className = 'final-banner';
  banner.id = 'finalBanner';
  banner.innerHTML = `
    <h2>Quiz Complete!</h2>
    <div class="final-score" id="finalScore"></div>
    <p id="finalPct"></p>
  `;
  container.appendChild(banner);

  const resetBtn = document.createElement('button');
  resetBtn.className = 'reset-btn';
  resetBtn.textContent = '↺ Restart Quiz';
  resetBtn.addEventListener('click', resetQuiz);
  container.appendChild(resetBtn);
}

function selectAnswer(qi, chosen) {
  const q = questions[qi];
  const card = document.getElementById(`card-${qi}`);
  if (card.dataset.answered) return;
  card.dataset.answered = '1';

  const isCorrect = chosen === q.correct;

  q.options.forEach((_, oi) => {
    const btn = document.getElementById(`opt-${qi}-${oi}`);
    btn.classList.add('disabled');
    if (oi === q.correct) {
      btn.classList.add(chosen === oi ? 'correct' : 'reveal-correct');
    } else if (oi === chosen) {
      btn.classList.add('wrong');
    }
  });

  const fb = document.getElementById(`fb-${qi}`);
  if (isCorrect) {
    fb.className = 'feedback correct-fb show';
    fb.innerHTML = `<span class="fb-icon">✓</span> Correct!`;
    card.classList.add('answered-correct');
    correct++;
  } else {
    fb.className = 'feedback wrong-fb show';
    fb.innerHTML = `<span class="fb-icon">✗</span> Incorrect — correct answer is <strong>${labels[q.correct]}: ${q.options[q.correct]}</strong>`;
    card.classList.add('answered-wrong');
    wrong++;
  }

  answered++;
  updateScore();
}

function resetQuiz() {
  answered = 0; correct = 0; wrong = 0;
  updateScore();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

render();
updateScore();
</script>
